<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocabulary Trainer</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --text: #f8fafc;
      --muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
      --secondary: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
    .container { width: 100%; max-width: 600px; }
    
    header { text-align: center; margin-bottom: 20px; }
    h1 { font-size: 1.8rem; margin-bottom: 6px; color: #fff; }
    p.subtitle { color: var(--muted); font-size: 0.9rem; }

    .nav-tabs { display: flex; gap: 10px; margin-bottom: 16px; }
    .tab-btn { flex: 1; padding: 12px; border: none; background: var(--card-bg); color: var(--muted); font-weight: 600; cursor: pointer; border-radius: 8px; }
    .tab-btn.active { background: var(--accent); color: white; }

    .card { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); margin-bottom: 16px; }
    
    .form-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: var(--muted); font-weight: 600; }
    input, textarea { width: 100%; padding: 10px 12px; border: 1px solid #334155; background: #0f172a; color: white; border-radius: 8px; font-size: 0.95rem; }

    .btn { width: 100%; padding: 12px; border: none; background: var(--accent); color: white; font-size: 1rem; font-weight: 600; border-radius: 8px; cursor: pointer; }
    .btn-secondary { background: var(--secondary); margin-top: 8px; font-size: 0.9rem; }

    .word-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #334155; }
    .word-term { font-weight: bold; font-size: 1.05rem; }
    .word-def { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
    .delete-btn { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 1.2rem; }

    .quiz-card { text-align: center; min-height: 200px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; border: 2px dashed #334155; }
    .prompt-label { font-size: 0.8rem; color: var(--accent); text-transform: uppercase; font-weight: bold; margin-bottom: 12px; }
    .quiz-term { font-size: 1.6rem; font-weight: bold; margin-bottom: 8px; word-break: break-word; }
    .quiz-def { font-size: 1.05rem; color: var(--muted); display: none; margin-top: 10px; }
    
    .audio-btn { background: #334155; color: white; border: none; border-radius: 20px; padding: 6px 14px; font-size: 0.85rem; cursor: pointer; margin-top: 8px; }

    .quiz-actions { display: flex; gap: 10px; margin-top: 16px; }
    .btn-correct { background: var(--success); }
    .btn-wrong { background: var(--danger); }
    
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Vocabulary Trainer</h1>
    <p class="subtitle">Flashcards & Pronunciation</p>
  </header>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('manage')">Manage Words</button>
    <button class="tab-btn" onclick="switchTab('quiz')">Test Me!</button>
  </div>

  <!-- MANAGE TAB -->
  <div id="manageTab">
    <div class="card">
      <div class="form-group">
        <label for="wordInput">Add New Word</label>
        <input type="text" id="wordInput" placeholder="e.g., Ephemeral">
      </div>
      <div class="form-group">
        <label for="meaningInput">Meaning / Definition</label>
        <textarea id="meaningInput" rows="2" placeholder="e.g., Lasting for a short time."></textarea>
      </div>
      <button class="btn" onclick="addWord()">Add Word</button>
      <button class="btn btn-secondary" style="background: #991b1b; color: #fecaca;" onclick="resetToDefault()">🔄 Reset to 80+ Default Words</button>
    </div>

    <div class="card">
      <div class="form-group">
        <label for="searchInput">🔍 Search Saved Words</label>
        <input type="text" id="searchInput" placeholder="Type to filter..." oninput="renderWordList()">
      </div>
      <h3 style="margin-bottom: 8px; font-size: 1rem;">Saved Words (<span id="wordCount">0</span>)</h3>
      <div id="wordList"></div>
    </div>
  </div>

  <!-- QUIZ TAB -->
  <div id="quizTab" class="hidden">
    <div class="card">
      <div id="quizContainer">
        <div class="card quiz-card" onclick="toggleAnswer()">
          <span class="prompt-label" id="cardState">Click to reveal definition</span>
          <div class="quiz-term" id="quizTerm">No words added yet!</div>
          <button class="audio-btn" id="speakBtn" onclick="speakTerm(event)">🔊 Listen</button>
          <div class="quiz-def" id="quizDef">Add words first.</div>
        </div>

        <div class="quiz-actions hidden" id="quizControls">
          <button class="btn btn-wrong" onclick="nextCard(false)">Needs Practice ❌</button>
          <button class="btn btn-correct" onclick="nextCard(true)">Got it! ✅</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const defaultWords = [
    {"id":1,"term":"resonate","meaning":"relate, match, echo"},
    {"id":2,"term":"fiction","meaning":"fake, product of imagination"},
    {"id":3,"term":"agenda","meaning":"plan, goals"},
    {"id":4,"term":"myriad","meaning":"a lot"},
    {"id":5,"term":"ominously","meaning":"evil, negative"},
    {"id":6,"term":"pursue","meaning":"chase, follow"},
    {"id":7,"term":"evoke","meaning":"provoke(reactions)"},
    {"id":8,"term":"trope","meaning":"topics, concerns"},
    {"id":9,"term":"indistinguishable","meaning":"similar"},
    {"id":10,"term":"replicant","meaning":"humanoid, clone"},
    {"id":11,"term":"vivid","meaning":"bright"},
    {"id":12,"term":"brute","meaning":"violent, rough, relentless, cruel"},
    {"id":13,"term":"entity","meaning":"being, body"},
    {"id":14,"term":"sentient","meaning":"able to experience within (emotions, senses)"},
    {"id":15,"term":"valid","meaning":"correct, sound"},
    {"id":16,"term":"disruptive(innovation)","meaning":"major change/tool that enters many parts of life"},
    {"id":17,"term":"incremental (innovation)","meaning":"small innovation"},
    {"id":18,"term":"benchmark","meaning":"standard/point of reference"},
    {"id":19,"term":"discern","meaning":"differentiate"},
    {"id":20,"term":"threshold","meaning":"limit/tolerance level"},
    {"id":21,"term":"recapitulate","meaning":"conclude, summarize"},
    {"id":22,"term":"ethos","meaning":"core moral beliefs, moral compass"},
    {"id":23,"term":"pioneer","meaning":"creator (the first)"},
    {"id":24,"term":"prowess","meaning":"great skill"},
    {"id":25,"term":"innate","meaning":"natural, inborn, inherent"},
    {"id":26,"term":"embody","meaning":"represent, personify"},
    {"id":27,"term":"perpetuate","meaning":"cause to continue, maintain"},
    {"id":28,"term":"hallmark","meaning":"typical feature, stamp"},
    {"id":29,"term":"hub","meaning":"center"},
    {"id":30,"term":"relentless","meaning":"non-stop"},
    {"id":31,"term":"complacent","meaning":"getting too comfortable(negative)"},
    {"id":32,"term":"strife","meaning":"struggle, suffering"},
    {"id":33,"term":"municipal","meaning":"local government"},
    {"id":34,"term":"accelerate","meaning":"speed up, quicken"},
    {"id":35,"term":"compact","meaning":"small (but in a good way)"},
    {"id":36,"term":"densely populated","meaning":"lots of people per square km"},
    {"id":37,"term":"sprawling","meaning":"expanding in terms of size"},
    {"id":38,"term":"duplicate","meaning":"copy"},
    {"id":39,"term":"slum","meaning":"poor neighbourhood"},
    {"id":40,"term":"spread","meaning":"proliferation"},
    {"id":41,"term":"surplus","meaning":"abundance"},
    {"id":42,"term":"staff","meaning":"personnel"},
    {"id":43,"term":"enclosed","meaning":"fenced"},
    {"id":44,"term":"ties","meaning":"bond, links, connections, network"},
    {"id":45,"term":"harshness","meaning":"severity"},
    {"id":46,"term":"fertile","meaning":"productive"},
    {"id":47,"term":"famine","meaning":"extreme hunger"},
    {"id":48,"term":"elaborate (adj)","meaning":"complex, sophisticated, detailed"},
    {"id":49,"term":"elaborate (v)","meaning":"expand, clarify"},
    {"id":50,"term":"subsistence","meaning":"survival level resources"},
    {"id":51,"term":"fragile","meaning":"weak, easy to break"},
    {"id":52,"term":"comprehensive","meaning":"detailed, clear"},
    {"id":53,"term":"bureaucracy","meaning":"paperwork, legislation"},
    {"id":54,"term":"wary","meaning":"careful"},
    {"id":55,"term":"encompass","meaning":"include"},
    {"id":56,"term":"urge","meaning":"desire, push"},
    {"id":57,"term":"qualitative","meaning":"study based on qualities"},
    {"id":58,"term":"quantitative","meaning":"study based on numbers"},
    {"id":59,"term":"fad","meaning":"short-lived trend"},
    {"id":60,"term":"beholden","meaning":"favor for a favor"},
    {"id":61,"term":"stress (v)","meaning":"highlight, emphasize"},
    {"id":62,"term":"leverage","meaning":"benefit"},
    {"id":63,"term":"ponder","meaning":"think deeply"},
    {"id":64,"term":"envisage","meaning":"imagine"},
    {"id":65,"term":"elevation","meaning":"rise, growth"},
    {"id":66,"term":"dicipline(N)","meaning":"subject"},
    {"id":67,"term":"intrinsic","meaning":"internal, inner"},
    {"id":68,"term":"mobilize","meaning":"equip with, empower, enable"},
    {"id":69,"term":"tedious","meaning":"boring, daunting"},
    {"id":70,"term":"scholarly","meaning":"scientific, academic"},
    {"id":71,"term":"pre-eminently","meaning":"predominantly"},
    {"id":72,"term":"pre-eminent","meaning":"superior"},
    {"id":73,"term":"subject matter","meaning":"topic(what is being discussed)"},
    {"id":74,"term":"apt","meaning":"suitable for"},
    {"id":75,"term":"inquiry","meaning":"request, search for information"},
    {"id":76,"term":"protagonist","meaning":"main character(usually a good one)"},
    {"id":77,"term":"antagonist","meaning":"main character (usually a bad one)"},
    {"id":78,"term":"collapse","meaning":"fall"},
    {"id":79,"term":"echo(V)","meaning":"resonate, relate"},
    {"id":80,"term":"deference","meaning":"respect, obedience"},
    {"id":81,"term":"disenchantment","meaning":"frustration, disappointment"},
    {"id":82,"term":"memorabilia","meaning":"tools kept from the past"},
    {"id":83,"term":"left","meaning":"liberal"},
    {"id":84,"term":"right","meaning":"conservative"},
    {"id":85,"term":"emblem","meaning":"symbol, representation, testament"},
    {"id":86,"term":"folk","meaning":"traditional"},
    {"id":87,"term":"dignity","meaning":"honor"},
    {"id":88,"term":"impetus","meaning":"driving factor, force"},
    {"id":89,"term":"amass","meaning":"collecting, gathering"},
    {"id":90,"term":"indulgence","meaning":"letting yourself do what's enjoyable"},
    {"id":91,"term":"flatter","meaning":"giving compliments in a fake way"},
    {"id":92,"term":"benevolence","meaning":"mercy, kindness"},
    {"id":93,"term":"eccentric","meaning":"weird, strange, unusual"},
    {"id":94,"term":"subversive","meaning":"used to overthrow the current regime"},
    {"id":95,"term":"condescension","meaning":"arrogant, patronizing"},
    {"id":96,"term":"hindsight","meaning":"realization of the past"},
    {"id":97,"term":"scrutinize","meaning":"analyse, investigate"}
  ];

  let words = JSON.parse(localStorage.getItem('vocab_final')) || defaultWords;
  let currentWord = null;

  function save() {
    localStorage.setItem('vocab_final', JSON.stringify(words));
    renderWordList();
  }

  function addWord() {
    const term = document.getElementById('wordInput').value.trim();
    const meaning = document.getElementById('meaningInput').value.trim();
    if (!term || !meaning) return alert("Enter both word and meaning");
    words.push({ id: Date.now(), term, meaning });
    document.getElementById('wordInput').value = '';
    document.getElementById('meaningInput').value = '';
    save();
  }

  function deleteWord(id) {
    words = words.filter(w => w.id !== id);
    save();
  }

  function resetToDefault() {
    words = [...defaultWords];
    save();
    alert("Reset back to 80+ default words!");
  }

  function renderWordList() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const listEl = document.getElementById('wordList');
    const filtered = words.filter(w => w.term.toLowerCase().includes(query) || w.meaning.toLowerCase().includes(query));
    document.getElementById('wordCount').textContent = words.length;

    if (filtered.length === 0) {
      listEl.innerHTML = '<p style="color:var(--muted); text-align:center; padding:10px;">No words found</p>';
      return;
    }

    listEl.innerHTML = filtered.map(w => `
      <div class="word-item">
        <div>
          <div class="word-term">${w.term}</div>
          <div class="word-def">${w.meaning}</div>
        </div>
        <button class="delete-btn" onclick="deleteWord(${w.id})">&times;</button>
      </div>
    `).join('');
  }

  function startQuiz() {
    if (words.length === 0) return;
    currentWord = words[Math.floor(Math.random() * words.length)];
    document.getElementById('cardState').textContent = 'Click to reveal definition';
    document.getElementById('quizTerm').textContent = currentWord.term;
    document.getElementById('quizDef').textContent = currentWord.meaning;
    document.getElementById('quizDef').style.display = 'none';
    document.getElementById('quizControls').classList.add('hidden');
  }

  function toggleAnswer() {
    if (!currentWord) return;
    const defEl = document.getElementById('quizDef');
    const isHidden = defEl.style.display === 'none';
    defEl.style.display = isHidden ? 'block' : 'none';
    document.getElementById('cardState').textContent = isHidden ? 'Definition:' : 'Click to reveal definition';
    document.getElementById('quizControls').classList.toggle('hidden', !isHidden);
  }

  function speakTerm(e) {
    e.stopPropagation();
    if ('speechSynthesis' in window && currentWord) {
      const text = currentWord.term.replace(/\s*\([^)]*\)/g, "");
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      window.speechSynthesis.speak(utterance);
    }
  }

  function nextCard() {
    startQuiz();
  }

  function switchTab(tab) {
    document.getElementById('manageTab').classList.toggle('hidden', tab !== 'manage');
    document.getElementById('quizTab').classList.toggle('hidden', tab !== 'quiz');
    const btns = document.querySelectorAll('.tab-btn');
    btns[0].classList.toggle('active', tab === 'manage');
    btns[1].classList.toggle('active', tab === 'quiz');
    if (tab === 'quiz') startQuiz();
  }

  renderWordList();
</script>
</body>
</html>
