<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocabulary Trainer Pro</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
      --secondary: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
    .container { width: 100%; max-width: 600px; }
    
    header { text-align: center; margin-bottom: 16px; }
    h1 { font-size: 1.8rem; margin-bottom: 4px; color: #fff; }
    p.subtitle { color: var(--muted); font-size: 0.9rem; }

    /* STREAK & BAR */
    .stats-bar { display: flex; justify-content: space-between; background: var(--card-bg); padding: 10px 16px; border-radius: 10px; margin-bottom: 16px; font-size: 0.9rem; font-weight: 600; border: 1px solid #334155; }
    .streak { color: #f59e0b; }

    .nav-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab-btn { flex: 1; padding: 10px 6px; border: none; background: var(--card-bg); color: var(--muted); font-size: 0.85rem; font-weight: 600; cursor: pointer; border-radius: 8px; transition: 0.2s; }
    .tab-btn.active { background: var(--accent); color: white; }

    .card { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); margin-bottom: 16px; }
    
    .form-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: var(--muted); font-weight: 600; }
    input, textarea { width: 100%; padding: 10px 12px; border: 1px solid #334155; background: #0f172a; color: white; border-radius: 8px; font-size: 0.95rem; }
    input:focus, textarea:focus { outline: 2px solid var(--accent); }

    .btn { width: 100%; padding: 12px; border: none; background: var(--accent); color: white; font-size: 1rem; font-weight: 600; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: var(--accent-hover); }
    .btn-secondary { background: var(--secondary); margin-top: 8px; font-size: 0.9rem; }

    .word-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #334155; }
    .word-term { font-weight: bold; font-size: 1.05rem; }
    .word-def { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
    .delete-btn { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 1.2rem; }

    /* FLASHCARD */
    .quiz-card { text-align: center; min-height: 180px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; border: 2px dashed #334155; user-select: none; }
    .prompt-label { font-size: 0.8rem; color: var(--accent); text-transform: uppercase; font-weight: bold; margin-bottom: 12px; }
    .quiz-term { font-size: 1.5rem; font-weight: bold; margin-bottom: 8px; word-break: break-word; }
    .quiz-def { font-size: 1rem; color: var(--muted); display: none; margin-top: 10px; }

    /* MULTIPLE CHOICE OPTIONS */
    .mc-options { display: grid; gap: 10px; margin-top: 14px; }
    .mc-btn { background: #0f172a; border: 1px solid #334155; color: white; padding: 12px; border-radius: 8px; font-size: 0.95rem; cursor: pointer; text-align: left; transition: 0.2s; }
    .mc-btn:hover { border-color: var(--accent); }
    .mc-btn.correct-choice { background: #15803d !important; border-color: var(--success) !important; color: white; }
    .mc-btn.wrong-choice { background: #991b1b !important; border-color: var(--danger) !important; color: white; }

    /* TYPING INPUT */
    .type-container { margin-top: 14px; }
    .type-feedback { font-weight: bold; margin-top: 10px; text-align: center; font-size: 0.95rem; }

    .quiz-actions { display: flex; gap: 10px; margin-top: 16px; }
    .btn-correct { background: var(--success); }
    .btn-wrong { background: var(--danger); }
    
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Vocabulary Trainer</h1>
    <p class="subtitle">Master Words Faster</p>
  </header>

  <!-- STREAK & PROGRESS BAR -->
  <div class="stats-bar">
    <span class="streak">🔥 Streak: <span id="streakCount">0</span> Days</span>
    <span>Reviewed Today: <b id="todayCount">0</b></span>
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('manage')">Manage</button>
    <button class="tab-btn" onclick="switchTab('cards')">Flashcards</button>
    <button class="tab-btn" onclick="switchTab('mc')">Quiz Mode</button>
    <button class="tab-btn" onclick="switchTab('type')">Spelling</button>
  </div>

  <!-- MANAGE TAB -->
  <div id="manageTab">
    <div class="card">
      <div class="form-group">
        <label for="wordInput">Add New Word / Phrase</label>
        <input type="text" id="wordInput" placeholder="e.g., Ephemeral">
      </div>
      <div class="form-group">
        <label for="meaningInput">Meaning / Definition</label>
        <textarea id="meaningInput" rows="2" placeholder="e.g., Lasting for a short time."></textarea>
      </div>
      <button class="btn" onclick="addWord()">Add Word</button>

      <div style="margin-top: 16px; border-top: 1px solid #334155; padding-top: 12px;">
        <button class="btn btn-secondary" style="background: #991b1b; color: #fecaca;" onclick="resetToDefault()">🔄 Reset List</button>
      </div>
    </div>

    <div class="card">
      <div class="form-group">
        <label for="searchInput">🔍 Search Saved Words</label>
        <input type="text" id="searchInput" placeholder="Type to filter..." oninput="renderWordList()">
      </div>
      <h3 style="margin-bottom: 8px; font-size: 1rem;">Saved Words (<span id="wordCount">0</span>)</h3>
      <div id="wordList"></div>
    </div>
  </div>

  <!-- 1. FLASHCARDS TAB -->
  <div id="cardsTab" class="hidden">
    <div class="card">
      <div class="card quiz-card" onclick="toggleAnswer()">
        <span class="prompt-label" id="cardState">Click to reveal definition</span>
        <div class="quiz-term" id="cardTerm">...</div>
        <div class="quiz-def" id="cardDef">...</div>
      </div>
      <div class="quiz-actions hidden" id="cardControls">
        <button class="btn btn-wrong" onclick="nextCard(false)">Needs Practice ❌</button>
        <button class="btn btn-correct" onclick="nextCard(true)">Got it! ✅</button>
      </div>
    </div>
  </div>

  <!-- 2. MULTIPLE CHOICE TAB -->
  <div id="mcTab" class="hidden">
    <div class="card">
      <span class="prompt-label">Select the correct definition:</span>
      <div class="quiz-term" id="mcTerm" style="margin-top:8px;">...</div>
      <div class="mc-options" id="mcOptions"></div>
      <button class="btn btn-secondary hidden" id="mcNextBtn" onclick="startMCQuiz()">Next Word ➔</button>
    </div>
  </div>

  <!-- 3. SPELLING / TYPING TAB -->
  <div id="typeTab" class="hidden">
    <div class="card">
      <span class="prompt-label">Type the matching term:</span>
      <div class="word-def" id="typeDef" style="font-size:1.1rem; color:white; margin: 12px 0;">...</div>
      <div class="type-container">
        <input type="text" id="typeInput" placeholder="Type word here..." autocomplete="off">
        <button class="btn" style="margin-top:10px;" onclick="checkTypeAnswer()">Check Answer</button>
      </div>
      <div class="type-feedback" id="typeFeedback"></div>
      <button class="btn btn-secondary hidden" id="typeNextBtn" onclick="startTypeQuiz()">Next Word ➔</button>
    </div>
  </div>

</div>

<script>
  const defaultWords = [
    {"id":1,"term":"resonate","meaning":"relate, match, echo"},
    {"id":2,"term":"fiction","meaning":"fake, product of imagination"},
    {"id":3,"term":"agenda","meaning":"plan, goals"},
    {"id":4,"term":"myriad","meaning":"a lot"},
    {"id":5,"term":"ominously","meaning":"evil, negative"},
    {"id":6,"term":"pursue","meaning":"chase, follow"},
    {"id":7,"term":"evoke","meaning":"provoke(reactions)"},
    {"id":8,"term":"trope","meaning":"topics, concerns"},
    {"id":9,"term":"indistinguishable","meaning":"similar"},
    {"id":10,"term":"vivid","meaning":"bright"},
    {"id":11,"term":"brute","meaning":"violent, rough, relentless, cruel"},
    {"id":12,"term":"sentient","meaning":"able to experience emotions/senses"},
    {"id":13,"term":"benchmark","meaning":"standard/point of reference"},
    {"id":14,"term":"discern","meaning":"differentiate"},
    {"id":15,"term":"ethos","meaning":"core moral beliefs"},
    {"id":16,"term":"prowess","meaning":"great skill"},
    {"id":17,"term":"innate","meaning":"natural, inborn"},
    {"id":18,"term":"perpetuate","meaning":"cause to continue"},
    {"id":19,"term":"relentless","meaning":"non-stop"},
    {"id":20,"term":"strife","meaning":"struggle, suffering"},
    {"id":21,"term":"accelerate","meaning":"speed up"},
    {"id":22,"term":"famine","meaning":"extreme hunger"},
    {"id":23,"term":"fragile","meaning":"weak, easy to break"},
    {"id":24,"term":"bureaucracy","meaning":"paperwork, legislation"},
    {"id":25,"term":"wary","meaning":"careful"},
    {"id":26,"term":"ponder","meaning":"think deeply"},
    {"id":27,"term":"tedious","meaning":"boring, daunting"},
    {"id":28,"term":"dignity","meaning":"honor"},
    {"id":29,"term":"benevolence","meaning":"mercy, kindness"},
    {"id":30,"term":"scrutinize","meaning":"analyse, investigate"}
  ];

  let words = JSON.parse(localStorage.getItem('vocab_v5_words')) || defaultWords;
  let stats = JSON.parse(localStorage.getItem('vocab_v5_stats')) || { streak: 0, lastDate: '', todayCount: 0 };
  let currentWord = null;

  // STREAK LOGIC
  function checkStreak() {
    const today = new Date().toISOString().split('T')[0];
    if (stats.lastDate !== today) {
      const yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      const yesterdayStr = yesterday.toISOString().split('T')[0];

      if (stats.lastDate !== yesterdayStr) {
        stats.streak = 0; // Missed a day
      }
      stats.todayCount = 0; // Reset daily count
    }
    document.getElementById('streakCount').textContent = stats.streak;
    document.getElementById('todayCount').textContent = stats.todayCount;
  }

  function incrementReview() {
    const today = new Date().toISOString().split('T')[0];
    if (stats.lastDate !== today) {
      stats.streak += 1;
      stats.lastDate = today;
    }
    stats.todayCount += 1;
    localStorage.setItem('vocab_v5_stats', JSON.stringify(stats));
    checkStreak();
  }

  function saveAndRender() {
    localStorage.setItem('vocab_v5_words', JSON.stringify(words));
    renderWordList();
  }

  function addWord() {
    const term = document.getElementById('wordInput').value.trim();
    const meaning = document.getElementById('meaningInput').value.trim();
    if (!term || !meaning) return alert("Fill in both fields!");
    words.push({ id: Date.now(), term, meaning });
    document.getElementById('wordInput').value = '';
    document.getElementById('meaningInput').value = '';
    saveAndRender();
  }

  function deleteWord(id) {
    words = words.filter(w => w.id !== id);
    saveAndRender();
  }

  function resetToDefault() {
    if (confirm("Reset to default words?")) {
      words = [...defaultWords];
      saveAndRender();
    }
  }

  function renderWordList() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const listEl = document.getElementById('wordList');
    const filtered = words.filter(w => w.term.toLowerCase().includes(query) || w.meaning.toLowerCase().includes(query));
    document.getElementById('wordCount').textContent = words.length;

    if (filtered.length === 0) {
      listEl.innerHTML = '<p style="color:var(--muted); text-align:center; padding:10px;">No words found.</p>';
      return;
    }

    listEl.innerHTML = filtered.map(w => `
      <div class="word-item">
        <div>
          <div class="word-term">${w.term}</div>
          <div class="word-def">${w.meaning}</div>
        </div>
        <button class="delete-btn" onclick="deleteWord(${w.id})">&times;</button>
      </div>
    `).join('');
  }

  /* 1. FLASHCARD MODE */
  function startCards() {
    if (words.length === 0) return;
    currentWord = words[Math.floor(Math.random() * words.length)];
    document.getElementById('cardState').textContent = 'Click to reveal definition';
    document.getElementById('cardTerm').textContent = currentWord.term;
    document.getElementById('cardDef').textContent = currentWord.meaning;
    document.getElementById('cardDef').style.display = 'none';
    document.getElementById('cardControls').classList.add('hidden');
  }

  function toggleAnswer() {
    if (!currentWord) return;
    const defEl = document.getElementById('cardDef');
    const isHidden = defEl.style.display === 'none';
    defEl.style.display = isHidden ? 'block' : 'none';
    document.getElementById('cardState').textContent = isHidden ? 'Definition:' : 'Click to reveal';
    document.getElementById('cardControls').classList.toggle('hidden', !isHidden);
  }

  function nextCard(success) {
    if (success) incrementReview();
    startCards();
  }

  /* 2. MULTIPLE CHOICE QUIZ MODE */
  function startMCQuiz() {
    if (words.length < 4) return alert("You need at least 4 words for multiple choice quiz!");
    document.getElementById('mcNextBtn').classList.add('hidden');
    currentWord = words[Math.floor(Math.random() * words.length)];
    document.getElementById('mcTerm').textContent = currentWord.term;

    // Grab 3 wrong options randomly
    let wrongPool = words.filter(w => w.id !== currentWord.id);
    wrongPool.sort(() => 0.5 - Math.random());
    let choices = [currentWord, wrongPool[0], wrongPool[1], wrongPool[2]];
    choices.sort(() => 0.5 - Math.random());

    const optionsContainer = document.getElementById('mcOptions');
    optionsContainer.innerHTML = choices.map(c => `
      <button class="mc-btn" onclick="checkMCOption(this, ${c.id === currentWord.id})">${c.meaning}</button>
    `).join('');
  }

  function checkMCOption(btn, isCorrect) {
    const allBtns = document.querySelectorAll('.mc-btn');
    allBtns.forEach(b => b.disabled = true);

    if (isCorrect) {
      btn.classList.add('correct-choice');
      incrementReview();
    } else {
      btn.classList.add('wrong-choice');
    }
    document.getElementById('mcNextBtn').classList.remove('hidden');
  }

  /* 3. SPELLING / TYPING MODE */
  function startTypeQuiz() {
    if (words.length === 0) return;
    document.getElementById('typeNextBtn').classList.add('hidden');
    document.getElementById('typeFeedback').textContent = '';
    document.getElementById('typeInput').value = '';
    document.getElementById('typeInput').disabled = false;

    currentWord = words[Math.floor(Math.random() * words.length)];
    document.getElementById('typeDef').textContent = currentWord.meaning;
  }

  function checkTypeAnswer() {
    const input = document.getElementById('typeInput').value.trim().toLowerCase();
    const cleanTarget = currentWord.term.replace(/\s*\([^)]*\)/g, "").trim().toLowerCase();
    const feedback = document.getElementById('typeFeedback');

    if (input === cleanTarget) {
      feedback.textContent = "Correct! 🎉";
      feedback.style.color = "var(--success)";
      document.getElementById('typeInput').disabled = true;
      document.getElementById('typeNextBtn').classList.remove('hidden');
      incrementReview();
    } else {
      feedback.textContent = `Not quite! Answer is: "${cleanTarget}"`;
      feedback.style.color = "var(--danger)";
      document.getElementById('typeNextBtn').classList.remove('hidden');
    }
  }

  /* TAB SWITCHER */
  function switchTab(tab) {
    ['manageTab', 'cardsTab', 'mcTab', 'typeTab'].forEach(t => document.getElementById(t).classList.add('hidden'));
    const btns = document.querySelectorAll('.tab-btn');
    btns.forEach(b => b.classList.remove('active'));

    if (tab === 'manage') {
      document.getElementById('manageTab').classList.remove('hidden');
      btns[0].classList.add('active');
    } else if (tab === 'cards') {
      document.getElementById('cardsTab').classList.remove('hidden');
      btns[1].classList.add('active');
      startCards();
    } else if (tab === 'mc') {
      document.getElementById('mcTab').classList.remove('hidden');
      btns[2].classList.add('active');
      startMCQuiz();
    } else if (tab === 'type') {
      document.getElementById('typeTab').classList.remove('hidden');
      btns[3].classList.add('active');
      startTypeQuiz();
    }
  }

  checkStreak();
  renderWordList();
</script>
</body>
</html>
