<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocabulary Trainer Pro</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
      --secondary: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
    .container { width: 100%; max-width: 600px; }
    
    header { text-align: center; margin-bottom: 20px; }
    h1 { font-size: 1.8rem; margin-bottom: 6px; color: #fff; }
    p.subtitle { color: var(--muted); font-size: 0.9rem; }

    .nav-tabs { display: flex; gap: 10px; margin-bottom: 16px; }
    .tab-btn { flex: 1; padding: 12px; border: none; background: var(--card-bg); color: var(--muted); font-weight: 600; cursor: pointer; border-radius: 8px; transition: all 0.2s; }
    .tab-btn.active { background: var(--accent); color: white; }

    .card { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); margin-bottom: 16px; }
    
    .form-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: var(--muted); font-weight: 600; }
    input, textarea { width: 100%; padding: 10px 12px; border: 1px solid #334155; background: #0f172a; color: white; border-radius: 8px; font-size: 0.95rem; }
    input:focus, textarea:focus { outline: 2px solid var(--accent); }

    .btn { width: 100%; padding: 12px; border: none; background: var(--accent); color: white; font-size: 1rem; font-weight: 600; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: var(--accent-hover); }
    
    .btn-secondary { background: var(--secondary); margin-top: 8px; font-size: 0.9rem; }
    .btn-secondary:hover { background: #475569; }

    .sync-actions { display: flex; gap: 10px; }

    /* Progress Bar */
    .progress-container { background: #334155; border-radius: 10px; height: 12px; width: 100%; overflow: hidden; margin: 10px 0 16px 0; }
    .progress-bar { background: var(--success); height: 100%; width: 0%; transition: width 0.3s ease; }

    /* Quiz Tools */
    .quiz-options { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 0.85rem; color: var(--muted); }
    .mode-toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; }

    .word-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #334155; }
    .word-item:last-child { border-bottom: none; }
    .word-term { font-weight: bold; font-size: 1.05rem; }
    .word-def { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
    .delete-btn { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 1.2rem; padding: 4px 8px; }

    .quiz-card { text-align: center; min-height: 220px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; user-select: none; border: 2px dashed #334155; position: relative; }
    .quiz-card:hover { border-color: var(--accent); }
    .prompt-label { font-size: 0.8rem; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; font-weight: bold; margin-bottom: 12px; }
    .quiz-term { font-size: 1.6rem; font-weight: bold; margin-bottom: 8px; word-break: break-word; }
    .quiz-def { font-size: 1.05rem; color: var(--muted); display: none; margin-top: 10px; }
    
    .audio-group { display: flex; gap: 8px; margin-top: 8px; }
    .audio-btn { background: #334155; color: white; border: none; border-radius: 20px; padding: 6px 14px; font-size: 0.85rem; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .audio-btn:hover { background: var(--accent); }

    .quiz-actions { display: flex; gap: 10px; margin-top: 16px; }
    .btn-correct { background: var(--success); }
    .btn-wrong { background: var(--danger); }
    
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Vocabulary Trainer Pro</h1>
    <p class="subtitle">Human Dictionary Audio • Smart Repetition</p>
  </header>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('manage')">Manage Words</button>
    <button class="tab-btn" onclick="switchTab('quiz')">Test Me!</button>
  </div>

  <!-- MANAGE TAB -->
  <div id="manageTab">
    <div class="card">
      <div class="form-group">
        <label for="wordInput">Add New Word / Phrase</label>
        <input type="text" id="wordInput" placeholder="e.g., Ephemeral">
      </div>
      <div class="form-group">
        <label for="meaningInput">Meaning / Definition</label>
        <textarea id="meaningInput" rows="2" placeholder="e.g., Lasting for a short time."></textarea>
      </div>
      <button class="btn" onclick="addWord()">Add Word</button>

      <div style="margin-top: 16px; border-top: 1px solid #334155; padding-top: 12px;">
        <div class="sync-actions">
          <button class="btn btn-secondary" onclick="exportWords()">📥 Export JSON</button>
          <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">📤 Import JSON</button>
        </div>
        <button class="btn btn-secondary" style="background: #991b1b; color: #fecaca;" onclick="resetToDefault()">🔄 Reset List</button>
        <input type="file" id="importFile" class="hidden" accept=".json" onchange="importWords(event)">
      </div>
    </div>

    <!-- SEARCH & WORD LIST -->
    <div class="card">
      <div class="form-group">
        <label for="searchInput">🔍 Search Saved Words</label>
        <input type="text" id="searchInput" placeholder="Type to filter..." oninput="renderWordList()">
      </div>
      <h3 style="margin-bottom: 8px; font-size: 1rem;">Saved Words (<span id="wordCount">0</span>)</h3>
      <div id="wordList"></div>
    </div>
  </div>

  <!-- QUIZ TAB -->
  <div id="quizTab" class="hidden">
    <div class="card" style="padding: 16px;">
      <div class="quiz-options">
        <span>Mastery Progress: <b id="masteryPercent">0%</b></span>
        <label class="mode-toggle">
          <input type="checkbox" id="reverseMode" onchange="startQuiz()">
          Reverse (Def → Term)
        </label>
      </div>
      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div id="quizContainer">
        <div class="card quiz-card" onclick="toggleAnswer()">
          <span class="prompt-label" id="cardState">Click to reveal definition</span>
          <div class="quiz-term" id="quizTerm">No words added yet!</div>
          
          <!-- DUAL AUDIO BUTTONS -->
          <div class="audio-group hidden" id="audioControls">
            <button class="audio-btn" onclick="playHumanAudio(event, 'us')">🔊 US Accent</button>
            <button class="audio-btn" onclick="playHumanAudio(event, 'uk')">🔊 UK Accent</button>
          </div>

          <div class="quiz-def" id="quizDef">Add or import words first.</div>
        </div>

        <div class="quiz-actions hidden" id="quizControls">
          <button class="btn btn-wrong" onclick="nextCard(false)">Needs Practice ❌</button>
          <button class="btn btn-correct" onclick="nextCard(true)">Got it! ✅</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const defaultWords = [
    {"id":1786654867752,"term":"resonate","meaning":"relate, match, echo"},
    {"id":1786654950535,"term":"fiction","meaning":"fake, product of imagination"},
    {"id":1786654963755,"term":"agenda","meaning":"plan, goals"},
    {"id":1786655724371,"term":"myriad","meaning":"a lot"},
    {"id":1786655739501,"term":"ominously","meaning":"evil, negative"},
    {"id":1786655767935,"term":"pursue","meaning":"chase, follow"},
    {"id":1786655902903,"term":"evoke","meaning":"provoke(reactions)"},
    {"id":1786655918738,"term":"trope","meaning":"topics, concerns"},
    {"id":1786655931841,"term":"indistinguishable","meaning":"similar"},
    {"id":1786655963388,"term":"replicant","meaning":"humanoid, clone"},
    {"id":1786655995702,"term":"vivid","meaning":"bright"},
    {"id":1786656019797,"term":"brute","meaning":"violent, rough, relentless, cruel"},
    {"id":1786656046202,"term":"entity","meaning":"being, body"},
    {"id":1786656136782,"term":"sentient","meaning":"able to experience wwithin (emotions, senses)"},
    {"id":1786656150796,"term":"valid","meaning":"correct, sound"},
    {"id":1786656192411,"term":"disruptive(innovation)","meaning":"major change/tool that enters many parts of life"},
    {"id":1786656219800,"term":"incremental (innovation)","meaning":"small innovation"},
    {"id":1786656247427,"term":"benchmark","meaning":"standard/point of reference"},
    {"id":1786656261081,"term":"discern","meaning":"differentiate"},
    {"id":1786656274858,"term":"threshold","meaning":"limit/tolerance level"},
    {"id":1786656292016,"term":"recapitulate","meaning":"conclude, summarize"},
    {"id":1786656318186,"term":"ethos","meaning":"core moral beliefs, moral compass"},
    {"id":1786656356467,"term":"pioneer","meaning":"creator (the first)"},
    {"id":1786656398820,"term":"prowess","meaning":"great skill"},
    {"id":1786656418047,"term":"innate","meaning":"natural, inborn, inherent"},
    {"id":1786656492818,"term":"embody","meaning":"represent, personify"},
    {"id":1786656542087,"term":"perpetuate","meaning":"cause to continue, maintain"},
    {"id":1786656567040,"term":"hallmark","meaning":"typical feature, stamp"},
    {"id":1786677809914,"term":"hub","meaning":"center"},
    {"id":1786677821442,"term":"relentless","meaning":"non-stop"},
    {"id":1786677849809,"term":"complacent","meaning":"getting too comfortable(negative)"},
    {"id":1786677863286,"term":"strife","meaning":"struggle, suffering"},
    {"id":1786677871718,"term":"municipal","meaning":"local government"},
    {"id":1786677886112,"term":"accelerate","meaning":"speed up, quicken"},
    {"id":1786677902587,"term":"compact","meaning":"small (but in a good way)"},
    {"id":1786677925173,"term":"densely populated","meaning":"lots of people per square km"},
    {"id":1786677940898,"term":"sprawling","meaning":"expanding in terms of size"},
    {"id":1786677949615,"term":"duplicate","meaning":"copy"},
    {"id":1786677968449,"term":"slum","meaning":"poor neighbourhood"},
    {"id":1786677980810,"term":"spread","meaning":"proliferation"},
    {"id":1786677995775,"term":"surplus","meaning":"abundance"},
    {"id":1786678005608,"term":"staff","meaning":"personnel"},
    {"id":1786678020565,"term":"enclosed","meaning":"fenced"},
    {"id":1786678036761,"term":"ties","meaning":"bond, links, connections, network"},
    {"id":1786678044909,"term":"harshness","meaning":"severity"},
    {"id":1786678058214,"term":"fertile","meaning":"productive"},
    {"id":1786678070134,"term":"famine","meaning":"extreme hunger"},
    {"id":1786678092952,"term":"elaborate (adj)","meaning":"complex, sophisticated, detailed"},
    {"id":1786678110034,"term":"elaborate (v)","meaning":"expand, clarify"},
    {"id":1786678153675,"term":"subsistence","meaning":"survival level resources"},
    {"id":1786678179778,"term":"fragile","meaning":"weak, easy to break"},
    {"id":1786678199910,"term":"comprehensive","meaning":"detailed, clear"},
    {"id":1786678214464,"term":"bureaucracy","meaning":"paperwork, legislation"},
    {"id":1786678221109,"term":"wary","meaning":"careful"},
    {"id":1786678230737,"term":"encompass","meaning":"include"},
    {"id":1786678242951,"term":"urge","meaning":"desire, push"},
    {"id":1786678264504,"term":"qualitative","meaning":"study based on qualities"},
    {"id":1786678290967,"term":"quantitative","meaning":"study based on numbers"},
    {"id":1786678301684,"term":"fad","meaning":"short-lived trend"},
    {"id":1786678330831,"term":"beholden","meaning":"favor for a favor (feeling responsibility for help proved earlier)"},
    {"id":1786678349827,"term":"stress (v)","meaning":"highlight, emphasize"},
    {"id":1786678359744,"term":"leverage","meaning":"benefit"},
    {"id":1786678402192,"term":"ponder","meaning":"think deeply"},
    {"id":1786678426435,"term":"envisage","meaning":"imagine"},
    {"id":1786678834388,"term":"elevation","meaning":"rise, growth"},
    {"id":1786678857303,"term":"dicipline(N)","meaning":"subject"},
    {"id":1786678869750,"term":"intrinsic","meaning":"internal, inner"},
    {"id":1786678899471,"term":"mobilize","meaning":"equip with, empower, enable"},
    {"id":1786678909267,"term":"tedious","meaning":"boring, daunting"},
    {"id":1786678920871,"term":"scholarly","meaning":"scientific, academic"},
    {"id":1786678935848,"term":"pre-eminently","meaning":"predominantly"},
    {"id":1786678944028,"term":"pre-eminent","meaning":"superior"},
    {"id":1786678962199,"term":"subject matter","meaning":"topic(what is being discussed)"},
    {"id":1786678973475,"term":"apt","meaning":"suitable for"},
    {"id":1786678992414,"term":"inquiry","meaning":"request, search for information"},
    {"id":1786679017094,"term":"protagonist","meaning":"main character(usually a good one)"},
    {"id":1786679039857,"term":"antagonist","meaning":"main character (usually a bad one)"},
    {"id":1786679052576,"term":"collapse","meaning":"fall"},
    {"id":1786679066837,"term":"echo(V)","meaning":"resonate, relate"},
    {"id":1786679079164,"term":"deference","meaning":"respect, obedience"},
    {"id":1786679130020,"term":"disenchantment","meaning":"frustration, disappointment"},
    {"id":1786679145368,"term":"memorabilia","meaning":"tools kept from the past"},
    {"id":1786679158968,"term":"left","meaning":"liberal"},
    {"id":1786679169982,"term":"right","meaning":"conservative"},
    {"id":1786679191020,"term":"emblem","meaning":"symbol, representation, testament"},
    {"id":1786679198469,"term":"folk","meaning":"traditional"},
    {"id":1786679205566,"term":"dignity","meaning":"honor"},
    {"id":1786679221561,"term":"impetus","meaning":"driving factor, force"},
    {"id":1786679236137,"term":"amass","meaning":"collecting, gathering"},
    {"id":1786679263195,"term":"indulgence","meaning":"letting yourself do what's enjoyable (but in a bad way)"},
    {"id":1786679281701,"term":"flatter","meaning":"giving compliments in a rather fake way"},
    {"id":1786679300337,"term":"benevolence","meaning":"mercy, kindness"},
    {"id":1786679319502,"term":"eccentric","meaning":"weird, strange, unusual"},
    {"id":1786679367325,"term":"subversive","meaning":"used to overthrow the current regime, opposing the \"normal\" idea"},
    {"id":1786679388301,"term":"condescension","meaning":"arrogant, patronizing"},
    {"id":1786679401877,"term":"hindsight","meaning":"realization of the past"},
    {"id":1786679426952,"term":"scrutinize","meaning":"analyse, investigate"}
  ];

  let savedWords = JSON.parse(localStorage.getItem('user_vocab_v3'));
  let words = (savedWords && savedWords.length > 0) ? savedWords : defaultWords.map(w => ({ ...w, score: 0 }));
  let currentWord = null;
  let isAnswerVisible = false;

  function saveAndRender() {
    localStorage.setItem('user_vocab_v3', JSON.stringify(words));
    renderWordList();
  }

  function addWord() {
    const term = document.getElementById('wordInput').value.trim();
    const meaning = document.getElementById('meaningInput').value.trim();

    if (!term || !meaning) {
      alert("Please enter both a word and its meaning!");
      return;
    }

    words.push({ id: Date.now(), term, meaning, score: 0 });
    document.getElementById('wordInput').value = '';
    document.getElementById('meaningInput').value = '';
    saveAndRender();
  }

  function deleteWord(id) {
    words = words.filter(w => w.id !== id);
    saveAndRender();
  }

  function resetToDefault() {
    if (confirm("Reset to default word list?")) {
      words = defaultWords.map(w => ({ ...w, score: 0 }));
      saveAndRender();
    }
  }

  function renderWordList() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const listEl = document.getElementById('wordList');
    const filtered = words.filter(w => w.term.toLowerCase().includes(query) || w.meaning.toLowerCase().includes(query));
    
    document.getElementById('wordCount').textContent = words.length;

    if (filtered.length === 0) {
      listEl.innerHTML = '<p style="color: var(--muted); text-align:center; padding: 12px;">No matching words found.</p>';
      return;
    }

    listEl.innerHTML = filtered.map(w => `
      <div class="word-item">
        <div>
          <div class="word-term">${w.term}</div>
          <div class="word-def">${w.meaning}</div>
        </div>
        <button class="delete-btn" onclick="deleteWord(${w.id})" title="Delete">&times;</button>
      </div>
    `).join('');
  }

  function exportWords() {
    if (words.length === 0) return alert("No words to export!");
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(words));
    const a = document.createElement('a');
    a.href = dataStr;
    a.download = "my_vocab_words.json";
    a.click();
  }

  function importWords(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(evt) {
      try {
        const imported = JSON.parse(evt.target.result);
        if (Array.isArray(imported)) {
          words = imported.map(w => ({ ...w, score: w.score || 0 }));
          saveAndRender();
          alert("Imported " + words.length + " words!");
        }
      } catch (err) { alert("Invalid JSON file."); }
    };
    reader.readAsText(file);
  }

  /* --- QUIZ LOGIC WITH SMART REPETITION --- */
  function startQuiz() {
    if (words.length === 0) {
      document.getElementById('quizTerm').textContent = "No words added yet!";
      document.getElementById('quizDef').textContent = "Add or import words first.";
      document.getElementById('cardState').style.display = 'none';
      document.getElementById('quizControls').classList.add('hidden');
      document.getElementById('audioControls').classList.add('hidden');
      return;
    }

    updateMasteryProgress();

    // Weighted selection for spaced repetition
    let pool = [];
    words.forEach(w => {
      let weight = Math.max(1, 5 - (w.score || 0));
      for (let i = 0; i < weight; i++) pool.push(w);
    });

    currentWord = pool[Math.floor(Math.random() * pool.length)];
    showCard();
  }

  function updateMasteryProgress() {
    const totalMastery = words.reduce((acc, w) => acc + Math.min(3, w.score || 0), 0);
    const maxMastery = words.length * 3;
    const percentage = maxMastery > 0 ? Math.round((totalMastery / maxMastery) * 100) : 0;

    document.getElementById('masteryPercent').textContent = percentage + '%';
    document.getElementById('progressBar').style.width = percentage + '%';
  }

  function showCard() {
    isAnswerVisible = false;
    const isReverse = document.getElementById('reverseMode').checked;

    document.getElementById('cardState').style.display = 'block';
    document.getElementById('cardState').textContent = isReverse ? 'Guess the Term:' : 'Click to reveal definition';

    document.getElementById('quizTerm').textContent = isReverse ? currentWord.meaning : currentWord.term;
    document.getElementById('quizDef').textContent = isReverse ? currentWord.term : currentWord.meaning;
    
    document.getElementById('quizDef').style.display = 'none';
    document.getElementById('quizControls').classList.add('hidden');

    const audioControls = document.getElementById('audioControls');
    if (!isReverse) {
      audioControls.classList.remove('hidden');
    } else {
      audioControls.classList.add('hidden');
    }
  }

  function toggleAnswer() {
    if (!currentWord) return;
    isAnswerVisible = !isAnswerVisible;
    const isReverse = document.getElementById('reverseMode').checked;

    document.getElementById('quizDef').style.display = isAnswerVisible ? 'block' : 'none';
    document.getElementById('cardState').textContent = isAnswerVisible ? (isReverse ? 'Term:' : 'Definition:') : 'Click to reveal';
    
    if (isAnswerVisible) {
      document.getElementById('quizControls').classList.remove('hidden');
      if (isReverse) document.getElementById('audioControls').classList.remove('hidden');
    } else {
      document.getElementById('quizControls').classList.add('hidden');
    }
  }

  /* --- HUMAN AUDIO PRONUNCIATION ENGINE --- */
  async function playHumanAudio(e, region) {
    if (e) e.stopPropagation();
    
    // Clean word string for API lookup (e.g. remove parentheses like "stress (v)" -> "stress")
    const cleanWord = currentWord.term.replace(/\s*\([^)]*\)/g, "").trim().toLowerCase();

    try {
      const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${cleanWord}`);
      if (!response.ok) throw new Error("Audio not found");
      
      const data = await response.json();
      let audioUrl = "";

      // Look for US or UK audio in the dictionary response
      if (data[0] && data[0].phonetics) {
        const matchingPhonetic = data[0].phonetics.find(p => p.audio && p.audio.includes(`-${region}.mp3`)) ||
                                 data[0].phonetics.find(p => p.audio && p.audio.length > 0);
        if (matchingPhonetic) audioUrl = matchingPhonetic.audio;
      }

      if (audioUrl) {
        const audio = new Audio(audioUrl);
        audio.play();
      } else {
        fallbackSpeech(cleanWord, region);
      }
    } catch (err) {
      // Fallback to built-in device voice if API audio is unavailable
      fallbackSpeech(cleanWord, region);
    }
  }

  function fallbackSpeech(text, region) {
    if ('speechSynthesis' in window) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = region === 'uk' ? 'en-GB' : 'en-US';
      window.speechSynthesis.speak(utterance);
    }
  }

  function nextCard(success) {
    if (success) {
      currentWord.score = (currentWord.score || 0) + 1;
    } else {
      currentWord.score = Math.max(0, (currentWord.score || 0) - 1);
    }
    saveAndRender();
    startQuiz();
  }

  function switchTab(tab) {
    const manageTab = document.getElementById('manageTab');
    const quizTab = document.getElementById('quizTab');
    const btns = document.querySelectorAll('.tab-btn');

    if (tab === 'manage') {
      manageTab.classList.remove('hidden');
      quizTab.classList.add('hidden');
      btns[0].classList.add('active');
      btns[1].classList.remove('active');
    } else {
      manageTab.classList.add('hidden');
      quizTab.classList.remove('hidden');
      btns[0].classList.remove('active');
      btns[1].classList.add('active');
      startQuiz();
    }
  }

  renderWordList();
</script>
</body>
</html>
